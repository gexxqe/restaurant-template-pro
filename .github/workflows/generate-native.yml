name: Generate native Android and iOS projects

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-native.yml"
      - "package.json"
      - "capacitor.config.json"
      - "resources/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Generate native projects
        run: |
          rm -rf android ios
          npx cap add android
          npx cap add ios
          npx capacitor-assets generate
          npx cap sync

      - name: Commit generated projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios package-lock.json
          if git diff --cached --quiet; then
            echo "No native changes to commit."
          else
            git commit -m "Generate Android and iOS Capacitor projects"
            git pull --rebase origin main
            git push
          fi
